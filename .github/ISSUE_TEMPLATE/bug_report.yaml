name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels:

bug
body:

type: textarea
id: description
attributes:
label: Description
description: Briefly describe the issue.
placeholder: Describe what went wrong.
validations:
required: true

type: textarea
id: steps
attributes:
label: Steps to Reproduce
description: Provide the steps needed to reproduce the issue.
placeholder: |
1.
2.
3.
validations:
required: true

type: textarea
id: expected
attributes:
label: Expected Behavior
description: What did you expect to happen?
validations:
required: true

type: textarea
id: actual
attributes:
label: Actual Behavior
description: What actually happened?
validations:
required: true

type: input
id: version
attributes:
label: Version
placeholder: e.g. 1.2.0
validations:
required: false

type: input
id: environment
attributes:
label: Environment
placeholder: e.g. Ubuntu 24.04, Node.js 22
validations:
required: false

type: textarea
id: additional
attributes:
label: Additional Context
description: Add logs, screenshots, or any other relevant information.
validations:
required: false