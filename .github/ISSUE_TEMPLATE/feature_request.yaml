name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels:

enhancement
body:

type: textarea
id: description
attributes:
label: Description
description: Briefly describe the feature or improvement you'd like to see.
placeholder: Describe your idea.
validations:
required: true

type: textarea
id: problem
attributes:
label: Problem
description: What problem would this feature solve?
placeholder: Describe the problem or use case.
validations:
required: true

type: textarea
id: proposed_solution
attributes:
label: Proposed Solution
description: Describe how you think this feature should work.
placeholder: Explain your proposed solution.
validations:
required: true

type: textarea
id: alternatives
attributes:
label: Alternatives Considered
description: Describe any alternative solutions or approaches you've considered.
validations:
required: false

type: textarea
id: additional
attributes:
label: Additional Context
description: Add examples, screenshots, or any other relevant information.
validations:
required: false